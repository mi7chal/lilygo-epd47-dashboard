name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          python -m pip install platformio

      - name: Check formatting
        run: clang-format --dry-run --Werror $(find src components test -name '*.cpp' -o -name '*.hpp')

      - name: Build
        run: platformio run

      - name: Platformio check
        run: platformio check --skip-packages

      - name: Test
        run: platformio test -e native
