name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.*', 'CMakeLists.txt', 'dependencies.lock') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install tools
        run: python -m pip install platformio clang-format

      - name: Check formatting
        run: clang-format --dry-run --Werror $(find src components test -name '*.cpp' -o -name '*.hpp')

      - name: Test
        run: platformio test -e native

      - name: Build
        run: platformio run -e T5-ePaper-S3

      - name: Platformio check
        run: platformio check -e T5-ePaper-S3 --skip-packages
